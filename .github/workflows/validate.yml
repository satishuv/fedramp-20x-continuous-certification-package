# CI gate, GitHub Actions edition. Same three checks as the AWS CodeBuild
# buildspec (automation/pipeline/buildspec-validate.yml):
#   1. Regenerate every deliverable from the record store and pinned dataset.
#   2. Refuse hand-edited generated files (regenerate-then-diff, Word documents
#      included: byte-reproducible since AUD-F35).
#   3. validate_sdr.py must pass with 0 hard failures.
# Plus two independent anti-circular-verification gates (audit-gate job):
#   4. Mutation runner: every closed defect, re-introduced, must turn its
#      regression test RED (a surviving OR skipped mutation fails).
#   5. Requirements-differential oracle: an independent dataset traversal must
#      reconcile exactly with the production applicability engine.
# Plus Bandit (security-scan job). The audit and security step lists are
# defined ONCE in audit/release_gate.py and shared with the AWS RELEASE_MODE
# build and `sdr.py release`. The `release-gate` job aggregates all three and
# is the single required status check on main (AUD-F12).
# Actions are pinned to full commit SHAs for supply-chain integrity.
name: validate-sdr

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow (release.yml) calls this whole workflow on a tag so a
  # published release has re-run the identical gate on the exact tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet --require-hashes -r requirements.lock
      - name: Regenerate all deliverables
        run: |
          # ONE build definition. `sdr.py build` regenerates the inactive
          # classes first (build_inactive_classes.py: SDR JSON, text AND Word
          # document per class) and the ACTIVE class last, so the release
          # manifest and records-store backfill reflect the active class and the
          # committed A/B/C artifacts, Word documents included, never drift
          # (AUD-F35/F36). The former per-class loop here is now inside the build.
          python sdr.py build
      - name: Refuse hand-edited generated files
        run: |
          # No exclusions. The Word documents are byte-reproducible since
          # AUD-F35, so a .docx that differs from its committed copy is a real
          # drift (or sample residue, AUD-F36), exactly like a JSON file.
          git diff --exit-code -- . || {
            echo "FAIL. Generated outputs differ from committed files."
            echo "Never edit generated files by hand; edit sdr/records/records-store.json and regenerate."
            exit 1
          }
      - name: Reproducibility gate (build twice, compare deterministic artifacts)
        run: |
          set -e
          find sdr package traceability artifacts validation/reports \
            -type f \( -name '*.json' -o -name '*.txt' -o -name '*.md' -o -name '*.csv' -o -name '*.docx' \) \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/repro-first.txt
          python sdr.py build > /dev/null
          find sdr package traceability artifacts validation/reports \
            -type f \( -name '*.json' -o -name '*.txt' -o -name '*.md' -o -name '*.csv' -o -name '*.docx' \) \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/repro-second.txt
          diff /tmp/repro-first.txt /tmp/repro-second.txt || {
            echo "FAIL. Deterministic artifacts changed across two identical builds."
            exit 1
          }
          echo "Reproducibility gate: byte-identical across two builds (Word documents included)."
      - name: Validate (full gate + A/B/C class matrix + offline test suite, CI parity via sdr.py)
        run: python sdr.py validate
      - name: Refuse a stale check catalog
        run: |
          python automation/sdrscan/sdrscan.py --write-catalog
          git diff --exit-code -- automation/sdrscan/check-catalog.json || {
            echo "FAIL. check-catalog.json is out of date with checks.py."
            echo "Run: python automation/sdrscan/sdrscan.py --write-catalog"
            exit 1
          }
      - name: Scan assessment readiness (reports, does not gate)
        run: |
          python automation/sdrscan/sdrscan.py --output-formats json,csv,html,txt \
            --only-fails --no-colour --ignore-exit-code-3
      - name: Upload validation and scan reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: validation-reports
          path: validation/reports/

  audit-gate:
    # Anti-circular-verification gate. Two independent checks that a green test
    # suite alone cannot provide:
    #   1. Mutation runner (audit/mutation_tests.py): re-introduces each closed
    #      defect into production code and asserts its named regression test goes
    #      RED. A SURVIVING mutation means the test cannot detect the defect it
    #      claims to guard -- a test-coverage hole -- and FAILS the check.
    #   2. Requirements-differential oracle (audit/requirements_oracle.py):
    #      derives the KSI universe / Class-B-optional set from the RAW pinned
    #      dataset with an INDEPENDENT traversal and reconciles it against the
    #      production applicability engine. Any discrepancy FAILS the check.
    # Both are HARD GATES (no `|| true`). New defects need a new mutation entry;
    # the runner SKIPs a mutation whose target code is absent, so a defect fixed
    # on an unmerged branch does not falsely pass here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet --require-hashes -r requirements.lock
      # The step list lives in audit/release_gate.py so this job, the AWS
      # RELEASE_MODE build, and `sdr.py release` cannot drift apart (AUD-F12).
      - name: Audit section of the release gate (HARD GATE)
        run: python audit/release_gate.py audit

  security-scan:
    # Static security analysis of ALL executable Python (root, automation,
    # validation), not just automation/. Runs in CI on every PR so a security
    # scan is a visible release signal rather than a local, bypassable hook.
    # HARD GATE (finding 16): a medium-or-higher severity/confidence Bandit
    # finding FAILS the check. Licensed scanners (ASH/Fortify) still run in the
    # internal release pipeline against the release commit; this public gate
    # enforces the open-source baseline so a real finding cannot merge behind a
    # bypassable local hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install --quiet bandit==1.8.6 pip-audit==2.10.1
      - name: Security section of the release gate (Bandit, HARD GATE)
        # Argument list lives in audit/release_gate.py (one definition for
        # CI, the AWS release build, and sdr.py release). The report is
        # written for the artifact upload below; a finding fails the step.
        run: python audit/release_gate.py security
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bandit-security-report
          path: bandit-report.txt

  release-gate:
    # THE ONE REQUIRED STATUS CHECK on main (AUD-F12). Succeeds only when every
    # section above succeeded. Requiring this single job means a merge can never
    # land with a red audit-gate or security-scan behind a green validate, which
    # is how v1.4.0 was released from a commit whose mutation gate was red.
    # `if: always()` makes this job run (and FAIL) even when a dependency
    # failed or was cancelled; without it the job would be skipped and a
    # skipped required check blocks nothing.
    needs: [validate, audit-gate, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate section must have succeeded
        env:
          VALIDATE: ${{ needs.validate.result }}
          AUDIT: ${{ needs.audit-gate.result }}
          SECURITY: ${{ needs.security-scan.result }}
        run: |
          echo "validate=$VALIDATE audit-gate=$AUDIT security-scan=$SECURITY"
          rc=0
          for pair in "validate:$VALIDATE" "audit-gate:$AUDIT" "security-scan:$SECURITY"; do
            job="${pair%%:*}"; result="${pair#*:}"
            if [ "$result" != "success" ]; then
              echo "FAIL. Release gate section '$job' result: $result"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then exit 1; fi
          echo "release-gate: PASS (validate, audit-gate, security-scan all succeeded)."




