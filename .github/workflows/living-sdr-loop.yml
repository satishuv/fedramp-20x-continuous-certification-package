# Scheduled living-SDR loop. Daily, this:
#   1. Assumes a READ-ONLY role in the provider's account via GitHub OIDC.
#   2. RESTORES the durable metric history from the provider's evidence bucket
#      (the runner is ephemeral; without this step every night starts from an
#      empty history and six months of runs leave nothing, AUD-F31).
#   3. Runs the collectors (read-only) to gather dated facts. A run that
#      observes nothing exits non-zero (AUD-F29) and fails this workflow.
#   4. Appends one metric datapoint per KSI (SDR-CSX-KMT accumulation). A run
#      that appends nothing exits non-zero (AUD-F30) and fails this workflow.
#   5. PUBLISHES the history back with compare-and-swap (AUD-F20) so two
#      overlapping runs cannot overwrite each other.
#   6. Regenerates deliverables and opens a PR ONLY if committed outputs changed.
#   7. On ANY failure, opens (or refreshes) a GitHub issue so a broken
#      collection is visible the day it breaks, not at submission (AUD-F32).
#
# Two privilege domains, three jobs (AUD-F89). Until this change one job held
# the AWS OIDC token AND contents/pull-requests/issues write, while executing
# repository-controlled Python against the provider's account. Now:
#
#   collect   id-token: write, contents: read.  Holds AWS credentials; can read
#             the repository and write nothing to it. Produces the regenerated
#             diff as a patch ARTIFACT.
#   propose   contents: write, pull-requests: write. Holds NO id-token and runs
#             no AWS step; applies the patch to a fresh checkout after checking
#             it touches only tracked deliverables, then opens the PR.
#   alarm     issues: write only. Files or refreshes the failure issue.
#
# A compromise of the collection path (a collector dependency, a crafted API
# response) can therefore not push a branch or open a PR, and the job that can
# write to the repository never holds a cloud credential. The patch is the only
# thing that crosses between them, and it is inspected before it is applied.
#
# What this deliberately does NOT do: it never sets a status, never writes the
# assessment field, and never commits the facts store or metric history (both
# are git-excluded because they derive from a real account). The metric history
# lives in the provider's evidence bucket; this workflow is one of its writers.
#
# This workflow is a TEMPLATE. It is disabled by default (no schedule until a
# provider sets AWS_OIDC_ROLE_ARN and removes the guard). A provider must:
#   - create a read-only IAM role trusting this repo via OIDC, with s3:GetObject /
#     s3:PutObject on the metric-history prefix of the evidence bucket,
#   - set the AWS_OIDC_ROLE_ARN, AWS_REGION and SDR_METRIC_HISTORY_BUCKET
#     repository variables. The loop REFUSES to run without the bucket: a run
#     with nowhere to persist would silently discard the history it builds.

name: living-sdr-loop

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

# Default for every job: read the repository, nothing else. Each job grants
# itself exactly what it needs below; no job holds both a cloud credential and
# a repository write.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Guard: does nothing until the provider configures the OIDC role. Keeps the
    # public template from failing daily on a fork that has no account wired.
    if: vars.AWS_OIDC_ROLE_ARN != ''
    permissions:
      id-token: write      # for OIDC role assumption
      contents: read       # read the repository; this job writes nothing to it
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      SDR_METRIC_HISTORY_BUCKET: ${{ vars.SDR_METRIC_HISTORY_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet --require-hashes -r requirements.lock

      - name: Refuse to run without a persistence target (AUD-F31)
        # The runner is ephemeral and the history is git-excluded. Without a
        # bucket to restore from and publish to, every run would rebuild a
        # one-day history and throw it away, while looking healthy.
        run: |
          if [ -z "$SDR_METRIC_HISTORY_BUCKET" ]; then
            echo "FAIL. SDR_METRIC_HISTORY_BUCKET is not set. The metric history"
            echo "cannot persist across runs on an ephemeral runner, so this run"
            echo "would silently discard the SDR-CSX-KMT history it builds."
            echo "Set the repository variable to the provider's evidence bucket."
            exit 1
          fi

      - name: Assume read-only role via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Collect facts (read-only; exits 4 when nothing was evaluated)
        run: python automation/collectors/collect_facts.py --region "${{ vars.AWS_REGION }}"

      - name: Restore, append, publish the metric history (compare-and-swap)
        # Same loop as automation/pipeline/buildspec-collect.yml: restore the
        # durable history (first run: confirmed-missing is allowed, any other
        # error aborts), append today's datapoints (exit 4 when none), publish
        # with If-Match on the restored ETag; a 412 (exit 3) means another run
        # landed first, so re-restore and fold our datapoints in, bounded.
        run: |
          set -e
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            python automation/metrics/publish_history.py restore --bucket "$SDR_METRIC_HISTORY_BUCKET"
            python automation/metrics/append_metrics.py
            rc=0
            python automation/metrics/publish_history.py publish \
              --bucket "$SDR_METRIC_HISTORY_BUCKET" --run-id "gha-${{ github.run_id }}" || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            elif [ "$rc" -eq 3 ] && [ "$attempt" -lt 4 ]; then
              echo "Publish conflict (another run landed first); retry $attempt of 3 after re-restore."
              sleep $((attempt * 5))
            else
              echo "FAIL. Metric history publish did not succeed (rc=$rc, attempt $attempt)."
              exit 1
            fi
          done

      - name: Pre-fill draft fields from facts (writes a git-excluded sidecar)
        run: python automation/prefill/prefill_from_facts.py --write || true

      - name: Regenerate the COMPLETE package (one build definition)
        run: python sdr.py build

      - name: Validate before proposing anything
        run: python sdr.py validate --no-tests

      - name: Capture the regenerated diff as a patch (tracked deliverables only)
        id: diff
        # Facts, metric history, and the pre-fill sidecar are git-excluded, so a
        # diff of TRACKED paths is exactly the set of committed deliverables the
        # build changed. Untracked files are never part of the patch: an
        # untracked file here is a private store, not a deliverable.
        run: |
          set -e
          if git diff --quiet -- .; then
            echo "No committed deliverable changed; nothing to propose today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/living-sdr
          git diff --binary -- . > /tmp/living-sdr/regenerated.patch
          git diff --name-only -- . > /tmp/living-sdr/changed-paths.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changed tracked paths:"
          cat /tmp/living-sdr/changed-paths.txt

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.diff.outputs.changed == 'true'
        with:
          name: living-sdr-regenerated
          path: /tmp/living-sdr/
          retention-days: 7
          if-no-files-found: error

  propose:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # This job can write to the repository and therefore holds NO cloud
    # credential: no id-token, no configure-aws-credentials step, no AWS
    # variable. It applies the patch the collect job produced, nothing else.
    permissions:
      contents: write      # to push the regeneration branch
      pull-requests: write # to open the PR
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: living-sdr-regenerated
          path: /tmp/living-sdr/

      - name: Refuse a patch that reaches outside the regenerated deliverables
        # The patch may change TRACKED files only (git-excluded private stores
        # cannot appear in it by construction), and never the workflows, the
        # audit ledger, the dependency lock or the pinned sources. The collect
        # job regenerates deliverables; a patch touching anything that governs
        # the gate itself is not a regeneration and is not applied.
        run: |
          set -e
          test -s /tmp/living-sdr/changed-paths.txt || { echo "FAIL. Empty change list."; exit 1; }
          bad=0
          while IFS= read -r p; do
            case "$p" in
              .github/*|audit/*|requirements*|references/*|profiles/common/*|*.py|*.yml|*.yaml|*.sh)
                echo "REFUSE: $p is not a regenerated deliverable."; bad=1 ;;
            esac
            git ls-files --error-unmatch -- "$p" >/dev/null 2>&1 || { echo "REFUSE: $p is not a tracked file."; bad=1; }
          done < /tmp/living-sdr/changed-paths.txt
          [ "$bad" -eq 0 ] || exit 1
          echo "Patch touches only tracked deliverables."

      - name: Apply the patch
        run: |
          set -e
          git apply --index --whitespace=nowarn /tmp/living-sdr/regenerated.patch
          git diff --cached --stat

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BRANCH="living-sdr/refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: scheduled SDR refresh $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"
          gh pr create --title "Scheduled SDR refresh $(date -u +%Y-%m-%d)" \
            --body "Automated read-only refresh. Regenerated deliverables from the pinned dataset and latest collected facts, produced by a job holding the AWS credential and no repository write, applied by this job holding a repository write and no AWS credential. No status was changed and no assessment was written. Review the diff before merging; collected facts are telemetry, not compliance conclusions." \
            || echo "PR may already exist for today."

  alarm:
    needs: [collect, propose]
    # Silence is the failure mode this closes: a collection that fails for
    # weeks leaves a gap in the SDR-CSX-KMT history that nothing reports
    # until submission. One open issue per failure streak; a repeat failure
    # comments on the existing issue instead of filing a duplicate.
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write        # to file the failure issue (AUD-F32); nothing else
    steps:
      - name: Open an issue on failure (AUD-F32)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="living-sdr-loop failed: KSI metric collection did not complete"
          BODY="The scheduled collection run failed on $(date -u +%Y-%m-%d). Until it succeeds again, no datapoint is added to the SDR-CSX-KMT history and the persistent-validation record has a gap that grows daily. Run: $RUN_URL"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
