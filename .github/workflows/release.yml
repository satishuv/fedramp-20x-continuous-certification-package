# Release publication (AUD-F12 / AUD-F15). Runs when a release tag is pushed.
#
# Why a workflow: v1.4.0 was published by hand from a commit whose audit-gate
# was red, with an unsigned tag (docs/versioning.md requires a signed one), and
# with no assets, so the release-only attestation that binds the manifest hash
# to the exact source commit was never publicly attached. Every one of those is
# a step a human can skip; this workflow cannot.
#
# Order:
#   1. verify-tag   the tag is annotated, it resolves to the commit this run is
#                   building, THAT COMMIT IS ON PROTECTED MAIN (AUD-F91, below),
#                   its signature VERIFIES against a key listed in
#                   .github/release-allowed-signers (git verify-tag,
#                   gpg.format=ssh; a valid signature from an unlisted key fails
#                   with "No principal matched"), and its name equals the
#                   committed release manifest's release_tag (tag <-> version
#                   identity). Fails closed on any mismatch.
#
# Why the ancestry check comes BEFORE the signature check (AUD-F91). The
# allowed-signers file is read from the tagged commit's own tree, so without
# this step a tag decided who was trusted to sign it: anyone able to push a
# commit and a v* tag could put their own public key into that commit's
# .github/release-allowed-signers, sign the tag with the matching private key,
# and pass `git verify-tag`. Requiring the tagged commit to be an ancestor of
# origin/main, fetched here by its own ref and never from the tag, means the
# signers file in force is one that went through main's required release-gate
# status check in a reviewed pull request. The branch protection on main
# (required status check, strict up-to-date, no force push, no deletion) is
# therefore part of this workflow's trust chain and is recorded as such in
# docs/versioning.md.
#   2. gate         the WHOLE validate workflow (validate + audit-gate +
#                   attack-gate + security-scan + the aggregate release-gate)
#                   re-run on the exact tagged commit.
#   3. publish      build the release attestation (binds the deterministic
#                   manifest hash to this commit/tree; refuses a dirty tree),
#                   assemble the active-class bundle from exactly the
#                   fingerprinted set, and attach manifest + attestation + SBOM
#                   + bundle to the GitHub Release. Creates the release if the
#                   tag has none, otherwise attaches to the existing one.
#
# Until AUD-F88 the signature check was structural (a signature block present),
# and the workflow said so: a tag signed by ANY key passed, and the cryptographic
# question was left to consumers. The allowed-signers file holds public keys
# only; the private half is the maintainer's own and is never in this repository
# (docs/versioning.md). Consumers can still run `git verify-tag` themselves with
# the same file. The workflow holds no signing key.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag must be annotated, on protected main, signed by a listed release key, on this commit, and equal the manifest's release_tag
        env:
          TAG: ${{ github.ref_name }}
          SIGNERS: .github/release-allowed-signers
          PROTECTED_BRANCH: main
        run: |
          set -e
          kind=$(git cat-file -t "refs/tags/$TAG")
          if [ "$kind" != "tag" ]; then
            echo "FAIL. $TAG is a lightweight tag (object type: $kind). Releases need an annotated, signed tag: git tag -s $TAG -m '...'"
            exit 1
          fi
          # AUD-F91: the tagged commit must be on the protected branch BEFORE
          # anything in its tree is trusted. Fetch main by its own ref, so the
          # comparison target comes from the branch protection on the server,
          # not from the tag being judged. A tag on a side-branch commit fails
          # here even when every later check would pass.
          tag_commit=$(git rev-list -n 1 "refs/tags/$TAG")
          git fetch --no-tags origin "+refs/heads/$PROTECTED_BRANCH:refs/remotes/origin/$PROTECTED_BRANCH"
          if ! git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/$PROTECTED_BRANCH"; then
            echo "FAIL. $TAG resolves to $tag_commit, which is not on protected $PROTECTED_BRANCH."
            echo "A release tag may point only at a commit that reached $PROTECTED_BRANCH through its"
            echo "required release-gate check; the allowed-signers file in that commit is the one"
            echo "trusted below. Tag a commit on $PROTECTED_BRANCH, not a branch."
            exit 1
          fi
          if ! git cat-file -p "refs/tags/$TAG" | grep -qE 'BEGIN (PGP|SSH) SIGNATURE'; then
            echo "FAIL. $TAG carries no signature. docs/versioning.md requires a signed release tag (git tag -s)."
            exit 1
          fi
          if ! grep -qE '^[^#[:space:]]+[[:space:]]' "$SIGNERS"; then
            echo "FAIL. $SIGNERS lists no signer; the workflow cannot decide whom to trust."
            exit 1
          fi
          # Cryptographic verification: the signature must be valid AND made by
          # a key listed in the allowed-signers file, in the git namespace.
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$SIGNERS"
          if ! git verify-tag "$TAG"; then
            echo "FAIL. $TAG's signature did not verify against $SIGNERS. Either the tag was"
            echo "signed by a key not listed there (rotate by adding the public key in a reviewed"
            echo "PR first), or the signature is invalid."
            exit 1
          fi
          # The tag must point at the commit this run is building, so the gate
          # and the published assets describe the same source. (tag_commit was
          # resolved above, before the ancestry check.)
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "FAIL. $TAG resolves to $tag_commit but this run is for $GITHUB_SHA."
            exit 1
          fi
          manifest_tag=$(python3 -c "import json;print(json.load(open('artifacts/release-manifest.json')).get('release_tag',''))")
          if [ "$manifest_tag" != "$TAG" ]; then
            echo "FAIL. Tag $TAG does not match the committed release manifest's release_tag ($manifest_tag)."
            echo "Bump FRAMEWORK_VERSION in validation/scripts/build_release_manifest.py, rebuild, commit, then tag."
            exit 1
          fi
          echo "Tag $TAG: annotated, on protected $PROTECTED_BRANCH, signature verified against $SIGNERS, on $GITHUB_SHA, matches release manifest."

  gate:
    needs: verify-tag
    uses: ./.github/workflows/validate.yml

  publish:
    needs: [verify-tag, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet --require-hashes -r requirements.lock
      - name: Build release attestation and bundle from the tagged commit
        run: |
          set -e
          python validation/scripts/build_release_attestation.py
          python validation/scripts/assemble_release_bundle.py
          (cd artifacts && zip -qr "release-bundle-${GITHUB_REF_NAME}.zip" release-bundle)
          ls -la artifacts/release-manifest.json artifacts/release-attestation.json artifacts/sbom.cdx.json "artifacts/release-bundle-${GITHUB_REF_NAME}.zip"
      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          assets="artifacts/release-manifest.json artifacts/release-attestation.json artifacts/sbom.cdx.json artifacts/release-bundle-${TAG}.zip"
          notes="Release ${TAG}. Full gate (validate, audit-gate, attack-gate, security-scan, release-gate) re-run on the tagged commit in this workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Assets: the deterministic release manifest, the release attestation binding that manifest's hash to commit ${GITHUB_SHA}, the SBOM, and the active-class bundle assembled from exactly the fingerprinted artifact set. See CHANGELOG.md for the change list. Build-provenance record, not a compliance determination."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; attaching assets."
            gh release upload "$TAG" $assets --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" $assets
          fi
