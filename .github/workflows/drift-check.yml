# Daily upstream drift check, GitHub Actions edition. Hash-compares the
# pinned FedRAMP sources against the live copies (FedRAMP updates schema
# files in place without renaming, so hashes are the only reliable signal).
# On drift the job fails and opens an issue so the change is visible even to
# watchers who ignore CI emails.
name: fedramp-drift-check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Compare pinned sources against upstream
        id: check
        run: |
          set -euo pipefail
          DRIFT=""
          DATASET_CHANGED=0
          check () {
            NAME="$1"; URL="$2"; PINNED="$3"
            # Fetch to a temp file with --fail so an HTTP error is a DOWNLOAD
            # FAILURE (job aborts), never an "error page" that gets hashed and
            # misreported as upstream drift. --retry rides out transient blips.
            TMP=$(mktemp)
            if ! curl --fail --show-error --silent --location --retry 3 \
                 --max-time 30 "$URL" -o "$TMP"; then
              echo "$NAME: DOWNLOAD FAILED (not treated as drift); aborting."
              rm -f "$TMP"
              exit 2
            fi
            LIVE=$(sha256sum "$TMP" | cut -d' ' -f1)
            rm -f "$TMP"
            LOCAL=$(sha256sum "$PINNED" | cut -d' ' -f1)
            if [ "$LIVE" = "$LOCAL" ]; then
              echo "$NAME: unchanged"
            else
              echo "$NAME: CHANGED upstream (live $LIVE vs pinned $LOCAL)"
              DRIFT="$DRIFT $NAME;"
              # Plain `if`, never `[ test ] && var=1`: under `set -e` a false
              # test as the function's last command makes check() return 1,
              # which aborts the whole step on the FIRST non-dataset drift.
              # That hid four schema drifts behind one on 2026-09-26 and left
              # the drift output empty for the issue step.
              if [ "$NAME" = "CR26-dataset" ]; then
                DATASET_CHANGED=1
              fi
            fi
          }
          check "CR26-dataset" "https://raw.githubusercontent.com/FedRAMP/rules/main/fedramp-consolidated-rules.json" "references/fedramp-consolidated-rules.json"
          check "CR26-rules-schema" "https://raw.githubusercontent.com/FedRAMP/rules/main/schemas/fedramp-consolidated-rules.schema.json" "references/fedramp-consolidated-rules.schema.json"
          check "SDR-schema" "https://www.fedramp.gov/schemas/fedramp-security-decision-record-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-security-decision-record-schema-2026-06-24.json"
          check "common-definitions-schema" "https://www.fedramp.gov/schemas/fedramp-common-definitions-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-common-definitions-schema-2026-06-24.json"
          check "CPO-schema" "https://www.fedramp.gov/schemas/fedramp-certification-package-overview-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-certification-package-overview-schema-2026-06-24.json"
          check "OCR-schema" "https://www.fedramp.gov/schemas/fedramp-ongoing-certification-report-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-ongoing-certification-report-schema-2026-06-24.json"
          check "incident-report-schema" "https://www.fedramp.gov/schemas/fedramp-incident-report-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-incident-report-schema-2026-06-24.json"
          check "SCN-schema" "https://www.fedramp.gov/schemas/fedramp-significant-change-notifications-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-significant-change-notifications-schema-2026-06-24.json"
          check "accepted-vuln-schema" "https://www.fedramp.gov/schemas/fedramp-accepted-vulnerability-info-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-accepted-vulnerability-info-schema-2026-06-24.json"
          check "VDR-schema" "https://www.fedramp.gov/schemas/fedramp-vulnerability-detail-report-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-vulnerability-detail-report-schema-2026-06-24.json"
          check "historical-ver-schema" "https://www.fedramp.gov/schemas/fedramp-historical-ver-activity-schema-2026-06-24.json" "artifacts/schemas/official/fedramp-historical-ver-activity-schema-2026-06-24.json"

          # Second official source of truth (FedRAMP Source Data page): the
          # narrative docs and changelog live in FedRAMP/2026-markdown, not in
          # the structured dataset. A timeline or guidance change lands here
          # without moving the dataset hash, so track the changelog against a
          # committed baseline rather than a pinned file. The baseline is
          # self-seeded on first run (see the "Seed baseline" step below) to
          # avoid hardcoding a hash whose normalization must match sha256sum.
          MDCHANGELOG="https://raw.githubusercontent.com/FedRAMP/2026-markdown/main/changelog.md"
          MDTMP=$(mktemp)
          if ! curl --fail --show-error --silent --location --retry 3 \
               --max-time 30 "$MDCHANGELOG" -o "$MDTMP"; then
            echo "2026-markdown-changelog: DOWNLOAD FAILED (not treated as drift); aborting."
            rm -f "$MDTMP"
            exit 2
          fi
          LIVE_MD=$(sha256sum "$MDTMP" | cut -d' ' -f1)
          rm -f "$MDTMP"
          echo "live_md=$LIVE_MD" >> "$GITHUB_OUTPUT"
          BASE_MD=$(cat .github/.markdown-changelog-baseline 2>/dev/null || echo "")
          if [ -z "$BASE_MD" ]; then
            echo "2026-markdown-changelog: baseline not yet recorded (will seed this run)"
          elif [ "$LIVE_MD" = "$BASE_MD" ]; then
            echo "2026-markdown-changelog: unchanged"
          else
            echo "2026-markdown-changelog: CHANGED upstream (live $LIVE_MD vs baseline $BASE_MD)"
            DRIFT="$DRIFT 2026-markdown-changelog;"
          fi
          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"
          echo "dataset_changed=$DATASET_CHANGED" >> "$GITHUB_OUTPUT"
          [ -z "$DRIFT" ]
      - name: Seed markdown changelog baseline on first run
        if: always()
        env:
          LIVE_MD: ${{ steps.check.outputs.live_md }}
        run: |
          if [ -n "$LIVE_MD" ] && [ ! -f .github/.markdown-changelog-baseline ]; then
            echo "$LIVE_MD" > .github/.markdown-changelog-baseline
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/.markdown-changelog-baseline
            git commit -m "chore: seed FedRAMP 2026-markdown changelog drift baseline"
            git push
          fi
      - name: Open an issue on drift
        # Only when the check step recorded drift. A download failure (exit 2)
        # or any other abort leaves `drift` empty and must fail the run WITHOUT
        # filing an issue that claims upstream changed (issue #188 was such an
        # empty-titled false report).
        if: failure() && steps.check.outputs.drift != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.check.outputs.drift }}
        run: |
          TITLE="FedRAMP upstream sources changed: $DRIFT"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq length)
          if [ "$EXISTING" = "0" ]; then
            ISSUE_BODY="$(printf 'Upstream FedRAMP sources changed. Re-pull the changed sources, diff against the pinned copies, re-run the pipeline and validation, and review before relying on the pinned copies. Detected by the scheduled drift-check workflow.\n\nIf only `2026-markdown-changelog` drifted (no dataset change), read the new entry at https://github.com/FedRAMP/2026-markdown/commits/main/changelog.md, then advance the baseline with `python validation/scripts/markdown_changelog.py --fetch --write-baseline .github/.markdown-changelog-baseline` and commit it. A dataset adoption advances this baseline itself once FedRAMP publishes the entry for the new version.')"
            gh issue create --title "$TITLE" --body "$ISSUE_BODY"
          fi
      - name: Set up Python for regeneration
        if: failure() && steps.check.outputs.dataset_changed == '1'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Regenerate from the new dataset and open a review PR
        # Only when the DATASET itself drifted: regenerating requirement text
        # only makes sense from a new dataset. A schema-only or markdown-only
        # change stays issue-only for a human to interpret. The PR regenerates
        # requirement text; it never touches a status or the assessment field.
        if: failure() && steps.check.outputs.dataset_changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install --quiet --require-hashes -r requirements.lock
          cp references/fedramp-consolidated-rules.json /tmp/dataset-old.json
          # Fetch to temp files with --fail so an HTTP error cannot overwrite the
          # canonical pinned files with an error page; validate JSON parses before
          # replacing; only then move into place.
          curl --fail --show-error --silent --location --retry 3 --max-time 60 \
            "https://raw.githubusercontent.com/FedRAMP/rules/main/fedramp-consolidated-rules.json" \
            -o /tmp/dataset-new.json
          python -c "import json,sys; json.load(open('/tmp/dataset-new.json')); print('dataset JSON OK')"
          curl --fail --show-error --silent --location --retry 3 --max-time 60 \
            "https://raw.githubusercontent.com/FedRAMP/rules/main/schemas/fedramp-consolidated-rules.schema.json" \
            -o /tmp/rules-schema-new.json
          python -c "import json,sys; json.load(open('/tmp/rules-schema-new.json')); print('rules schema JSON OK')"
          mv /tmp/dataset-new.json references/fedramp-consolidated-rules.json
          mv /tmp/rules-schema-new.json references/fedramp-consolidated-rules.schema.json
          NEWVER=$(python -c "import json;print(json.load(open('references/fedramp-consolidated-rules.json'))['info']['version'])")
          UPSTREAM_SHA=$(git ls-remote https://github.com/FedRAMP/rules main | cut -f1)
          # Report material rule + KSI changes for the PR body.
          python validation/scripts/dataset_diff.py /tmp/dataset-old.json \
            references/fedramp-consolidated-rules.json --json /tmp/dataset-diff.json \
            | tee /tmp/dataset-diff.txt
          python validation/scripts/change_impact.py --diff /tmp/dataset-diff.json \
            --json /tmp/change-impact.json \
            | tee /tmp/change-impact.txt
          # Generate the proposed source lock as PART of the reviewable PR, so
          # the new file and the lock agree (do NOT disable the lock check).
          python validation/scripts/update_sources_lock.py --upstream-commit "$UPSTREAM_SHA"
          # Regenerate the COMPLETE package (one build definition) and run the
          # full validation suite - not a partial script list.
          python sdr.py build
          python sdr.py validate --no-tests
          # AUD-F44: FedRAMP rebuilds 2026-markdown from fedramp/rules on every
          # dataset release, so changelog.md gains an entry for $NEWVER. Fetch
          # it (--fail, so an error page is a download failure, never content),
          # put FedRAMP's own description of the change in the review body, and
          # advance the markdown drift baseline ONLY when that entry exists: the
          # reviewer of this PR reads it, so the next scheduled check must not
          # re-report it as drift (issue #211 did exactly that after the
          # 2026.10.08.01 adoption; PR #205 re-set it by hand after 2026.10.05.01).
          # When the entry is not published yet the baseline is left alone and
          # the daily check surfaces it when it lands.
          curl --fail --show-error --silent --location --retry 3 --max-time 30 \
            "https://raw.githubusercontent.com/FedRAMP/2026-markdown/main/changelog.md" \
            -o /tmp/changelog.md
          python validation/scripts/markdown_changelog.py --file /tmp/changelog.md \
            --version "$NEWVER" --entry-out /tmp/changelog-entry.txt \
            --write-baseline .github/.markdown-changelog-baseline
          BRANCH="drift/dataset-$NEWVER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Everything the build regenerated, Word documents included: since
          # AUD-F35 the .docx is byte-reproducible and CI refuses a tree whose
          # generated files differ from the committed ones, so excluding it
          # here made every adoption PR fail that gate (AUD-F40).
          git add -- .
          git commit -m "chore: adopt CR26 dataset $NEWVER (lock + full regenerate)"
          # AUD-F43: every hand-off below is fail-VISIBLE. The 2026-10-09 run
          # (37935122018) regenerated, validated and pushed the adoption branch,
          # then GitHub refused the PR ("GitHub Actions is not permitted to
          # create or approve pull requests") and this step said "PR may already
          # exist" and exited 0: the review path was never established and
          # nothing reported it. Now: a push that fails for any reason other
          # than the branch already being on the remote is an error; when the
          # PR cannot be opened, the branch, the compare link and the full
          # review body are posted on the drift issue so a human can open the
          # PR in one click, and the step exits non-zero so the log says why.
          REPO="${GITHUB_REPOSITORY}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists on the remote; leaving it as is"
          else
            git push -u origin "$BRANCH"
          fi
          DIFF_SUMMARY=$(cat /tmp/dataset-diff.txt 2>/dev/null || echo "(diff unavailable)")
          IMPACT_SUMMARY=$(cat /tmp/change-impact.txt 2>/dev/null || echo "(impact unavailable)")
          CHANGELOG_ENTRY=$(cat /tmp/changelog-entry.txt 2>/dev/null || echo "(changelog entry unavailable)")
          BODY="$(printf 'The pinned CR26 dataset drifted from upstream. This PR validates the new dataset against the official rules schema, updates the source lock (version/hash/upstream commit), and regenerates the COMPLETE package via `python sdr.py build` + `python sdr.py validate`.\n\n## FedRAMP changelog entry for %s\n\n%s\n\n## Material rule and KSI changes\n```\n%s\n```\n\n## Downstream impact on this package\n```\n%s\n```\n\nREVIEW the diff and impact before merging. No status was changed and no assessment was written.' "$NEWVER" "$CHANGELOG_ENTRY" "$DIFF_SUMMARY" "$IMPACT_SUMMARY")"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING_PR" != "0" ]; then
            echo "a PR for $BRANCH is already open; nothing to create"
            exit 0
          fi
          if gh pr create --title "CR26 dataset update: adopt $NEWVER" --body "$BODY"; then
            exit 0
          fi
          # PR creation refused (most likely the repository setting "Allow GitHub
          # Actions to create and approve pull requests" is off). Hand the review
          # to a human through the drift issue, then fail loudly.
          COMPARE_URL="https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
          ISSUE=$(gh issue list --state open --search "FedRAMP upstream sources changed in:title" --json number --jq '.[0].number // empty')
          NOTE="$(printf 'The drift workflow regenerated and validated the package against CR26 dataset %s and pushed branch `%s` (commit %s), but could not open the review PR: GitHub refused the request (usually because the repository setting "Allow GitHub Actions to create and approve pull requests" is off). Open the PR here: %s\n\nThe PR body it would have used follows.\n\n---\n\n%s' "$NEWVER" "$BRANCH" "$(git rev-parse --short HEAD)" "$COMPARE_URL" "$BODY")"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$NOTE"
            echo "::error::PR creation refused; review hand-off posted on issue #$ISSUE ($COMPARE_URL)"
          else
            gh issue create --title "Adoption PR for CR26 dataset $NEWVER could not be opened" --body "$NOTE"
            echo "::error::PR creation refused; review hand-off filed as a new issue ($COMPARE_URL)"
          fi
          exit 1
