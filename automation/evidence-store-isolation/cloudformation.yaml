# Evidence-store control-plane isolation - REFERENCE stack
#
# This is a REFERENCE, not a turnkey deployment. It demonstrates the account
# topology that makes the chain of custody real: the evidence store and its
# signing key live OUTSIDE the assessed accounts' blast radius, so a privileged
# actor in an assessed account can neither rewrite a signed evidence record nor
# forge a new signature. The specific account ids, OU structure, and trust
# relationships are the provider's decision - fill in the parameters for your
# own AWS Organization.
#
# What this template provisions (in the DEDICATED AUDIT/EVIDENCE account):
#   - The evidence-store S3 bucket with versioning + Object Lock (WORM).
#   - A bucket policy that DENIES the assessed accounts' collector roles any
#     Put/Delete/ACL mutation, and allows only a narrow cross-account writer
#     role to PutObject (append evidence), never delete or overwrite-lock.
#   - A KMS ASYMMETRIC signing key (ECC_NIST_P256) whose key policy grants
#     kms:Sign ONLY to the separate signer principal - the collector role is
#     explicitly denied kms:Sign. This is the property automation/collectors/
#     sign_evidence.py relies on: the collector cannot reach the signing key.
#   - Server access logging to a SEPARATE log bucket, so access to the evidence
#     store is logged independently of the accounts being assessed
#     (AU-09 (04) / KSI-MLA-ALA).
#
# Mapped controls: see traceability/evidence-store-controls.json.
#
# BOUNDARY (stated plainly): non-repudiation holds only if the AuditAccount is
# genuinely administered separately from the AssessedAccounts. If one human is
# admin of both, this topology documents the intent but does not enforce it -
# separation of duties on the audit account is an organizational control the
# template cannot create for you.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  REFERENCE: isolated evidence store + separate signer key for the FedRAMP 20x
  living-SDR loop. Deploy in a dedicated audit/evidence account. Provider fills
  in account ids and principals. Demonstrates AU-09/AU-09(02-04)/AU-10/AU-11 and
  KSI-MLA-ALA control-plane isolation.

Parameters:
  EvidenceBucketName:
    Type: String
    Description: Globally unique name for the evidence-store bucket (this account).
  AssessedCollectorRoleArns:
    Type: CommaDelimitedList
    Description: >
      ARNs of the read-only collector roles in the ASSESSED accounts. These are
      DENIED any mutation of the evidence store and DENIED kms:Sign on the
      signer key. (They never need either: collectors read, a separate writer
      appends, a separate signer signs.)
  CrossAccountWriterRoleArn:
    Type: String
    Description: >
      ARN of the single narrow role permitted to append (PutObject) evidence to
      the store. Held by the ingestion path, not by the collectors.
  SignerPrincipalArn:
    Type: String
    Description: >
      ARN of the SEPARATE signer principal that holds kms:Sign on the evidence
      signing key. Must NOT be a collector role.
  ObjectLockRetentionDays:
    Type: Number
    Default: 365
    Description: Object Lock (WORM) default retention in days.

Resources:

  EvidenceLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: >-
              This bucket IS the server-access-log destination for EvidenceBucket.
              A log bucket cannot log to another log bucket without an infinite
              chain (standard S3 log-bucket exception). Mirrored in .ash.yaml.
    Properties:
      BucketName: !Sub "${EvidenceBucketName}-access-logs"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Versioning protects delivered access-log objects from silent overwrite
      # or deletion: the logs are themselves evidence of who read the evidence.
      # Versioning is compatible with log delivery (Object Lock is not; see below).
      VersioningConfiguration:
        Status: Enabled
      # A server-access-log DESTINATION bucket MUST use SSE-S3 (AES256), not
      # SSE-KMS: AWS does not support delivering server access logs to a bucket
      # with SSE-KMS default encryption (the log objects would be encrypted with
      # a key the log delivery cannot use). It also must NOT have Object Lock or
      # a default retention period - S3 refuses Object-Lock buckets as log
      # destinations. So this bucket is deliberately SSE-S3 and lock-free, unlike
      # the evidence bucket.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # With Bucket Owner Enforced (ACLs disabled), the ONLY way to authorize the S3
  # log delivery service to write access logs is a bucket policy granting the
  # logging service principal s3:PutObject, scoped to the evidence bucket as the
  # source (aws:SourceArn / aws:SourceAccount). Without this policy, server
  # access logging on the evidence bucket silently fails to deliver (finding 9).
  EvidenceLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: "s3:PutObject"
            Resource: !Sub "${EvidenceLogBucket.Arn}/evidence-access/*"
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:s3:::${EvidenceBucketName}"
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          - Sid: DenyInsecureTransport
            # Finding 14: require TLS for the access-log bucket too.
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EvidenceLogBucket.Arn
              - !Sub "${EvidenceLogBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref EvidenceBucketName
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: !Ref ObjectLockRetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      LoggingConfiguration:
        DestinationBucketName: !Ref EvidenceLogBucket
        LogFilePrefix: evidence-access/

  # Deny the assessed collector roles ANY mutation; allow only the narrow writer
  # to append. The store's control plane is thus outside the assessed accounts.
  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyAssessedCollectorMutations
            Effect: Deny
            Principal:
              AWS: !Ref AssessedCollectorRoleArns
            Action:
              - "s3:PutObject"
              - "s3:DeleteObject"
              - "s3:DeleteObjectVersion"
              - "s3:PutObjectAcl"
              - "s3:BypassGovernanceRetention"
            Resource: !Sub "${EvidenceBucket.Arn}/*"
          # Object Lock tampering is denied for everyone except the writer.
          # Split by resource scope: PutBucketObjectLockConfiguration is a
          # BUCKET-level action and must target the bucket ARN, while
          # PutObjectLegalHold / PutObjectRetention are OBJECT-level actions and
          # must target the object ARN (bucket/*). A single statement pointing
          # all three at the bucket ARN silently no-ops the two object actions,
          # since an object action only matches an object-ARN resource.
          - Sid: DenyBucketObjectLockConfigTampering
            Effect: Deny
            Principal: "*"
            Action: "s3:PutBucketObjectLockConfiguration"
            Resource: !GetAtt EvidenceBucket.Arn
            Condition:
              StringNotEquals:
                "aws:PrincipalArn": !Ref CrossAccountWriterRoleArn
          - Sid: DenyObjectRetentionTampering
            Effect: Deny
            Principal: "*"
            Action:
              - "s3:PutObjectLegalHold"
              - "s3:PutObjectRetention"
            Resource: !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              StringNotEquals:
                "aws:PrincipalArn": !Ref CrossAccountWriterRoleArn
          - Sid: AllowNarrowWriterContentAddressedAppend
            Effect: Allow
            Principal:
              AWS: !Ref CrossAccountWriterRoleArn
            Action: "s3:PutObject"
            # Finding 10: Object Lock protects the EXISTING version of a key, but
            # s3:PutObject to an existing key still creates a NEW version, and a
            # GET of that key then resolves to the newer version - so a plain
            # PutObject grant is not genuinely append-only. The writer is scoped
            # to the content-addressed prefix evidence/ where the key IS the
            # content hash (evidence/<sha256>.json): re-putting identical content
            # is the same key, and different content necessarily lands at a
            # different key, so a content key's GET is stable and immutable in
            # practice. The ingestion path records the returned VersionId and the
            # content hash into release provenance so a specific immutable
            # version is bound, not merely "the latest under this key".
            Resource: !Sub "${EvidenceBucket.Arn}/evidence/*"
          - Sid: DenyInsecureTransport
            # Finding 14: require TLS for all access to the evidence bucket, to
            # match the main pipeline's buckets. Deny any request not over
            # HTTPS (aws:SecureTransport=false), for every principal and both
            # the bucket and its objects.
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # Asymmetric signing key for evidence digests. kms:Sign is granted ONLY to the
  # separate signer principal; the assessed collector roles are DENIED it.
  EvidenceSigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Asymmetric signing key for SDR evidence digests (AU-10 non-repudiation)
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: KeyAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowSignerToSign
            Effect: Allow
            Principal:
              AWS: !Ref SignerPrincipalArn
            Action:
              - "kms:Sign"
              - "kms:GetPublicKey"
              - "kms:DescribeKey"
            Resource: "*"
          - Sid: DenyAssessedCollectorsSign
            Effect: Deny
            Principal:
              AWS: !Ref AssessedCollectorRoleArns
            Action: "kms:Sign"
            Resource: "*"

  EvidenceSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/sdr-evidence-signer
      TargetKeyId: !Ref EvidenceSigningKey

Outputs:
  EvidenceBucketArn:
    Value: !GetAtt EvidenceBucket.Arn
  SigningKeyArn:
    Value: !GetAtt EvidenceSigningKey.Arn
    Description: Pass this to automation/collectors/sign_evidence.py as key_id.
  SigningKeyAlias:
    Value: !Ref EvidenceSigningKeyAlias
