# Scheduled daily when EnableCollectorSchedule is true. Runs the read-only
# facts collector against this account and uploads the timestamped facts
# store to the evidence bucket under facts/. Facts are telemetry, never
# statuses; the daily cadence feeds the SDR-CSX-KMT historical metrics and
# the FRC-CSX-MOT persistent-validation clock.
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      # Pinned to match the repository's CI dependency set (reproducible builds).
      - pip install --quiet --require-hashes -r requirements.lock
  build:
    commands:
      # 1. Collect today's read-only facts. Exit 4 (AUD-F29) means NOTHING was
      #    evaluated (every check errored or was denied): the build FAILS here,
      #    the failure notification fires (AUD-F32), and no empty day is
      #    recorded. Facts are still written for diagnosis.
      - python automation/collectors/collect_facts.py
      - |
        LATEST=$(ls -t automation/facts/*.json | head -1)
        aws s3 cp "$LATEST" "s3://$EVIDENCE_BUCKET/facts/$(basename "$LATEST")"
      # 2. RESTORE the prior metric history so the longitudinal SDR-CSX-KMT /
      #    FRC-CSX-MOT history accumulates across ephemeral runs, remembering the
      #    object's ETag for the conditional publish in step 4.
      #    FAIL-CLOSED: a genuine "object does not exist" (first run) is allowed,
      #    but ANY other restore error (AccessDenied, KMS, throttling, outage)
      #    ABORTS before step 3/4 rebuild and publish the durable history.
      # 3. Append today's datapoint per KSI to the (restored) history. Exit 4
      #    (AUD-F30) means no KSI received a datapoint; the build FAILS rather
      #    than publishing a history whose last_run looks freshly maintained.
      # 4. PUBLISH with compare-and-swap (AUD-F20): the run's observations are
      #    archived append-only, then the history is uploaded with
      #    If-Match: <restored ETag>. If another run published in between (412),
      #    exit 3 triggers a bounded retry of restore -> append -> publish, so
      #    the other run's datapoints are folded in rather than overwritten.
      - |
        set -e
        attempt=0
        while :; do
          attempt=$((attempt + 1))
          python automation/metrics/publish_history.py restore --bucket "$EVIDENCE_BUCKET"
          python automation/metrics/append_metrics.py
          rc=0
          python automation/metrics/publish_history.py publish --bucket "$EVIDENCE_BUCKET" || rc=$?
          if [ "$rc" -eq 0 ]; then
            break
          elif [ "$rc" -eq 3 ] && [ "$attempt" -lt 4 ]; then
            echo "Publish conflict (another run landed first); retry $attempt of 3 after re-restore."
            sleep $((attempt * 5))
          else
            echo "FAIL. Metric history publish did not succeed (rc=$rc, attempt $attempt)."
            exit 1
          fi
        done
