# CI gate for the SDR repository. Three checks, in order:
#   1. Regenerate every deliverable from the record store and pinned dataset.
#   2. Refuse hand-edited generated files: after regeneration the working
#      tree must be clean (deterministic pipeline makes this possible).
#      Docx files are excluded because their zip container embeds
#      file-entry timestamps; their content is covered by the validator.
#   3. validate_sdr.py must pass with 0 hard failures (schema, coverage,
#      test minimums, hygiene, content fidelity against the dataset).
#   4. sdrscan reports assessment readiness per rule and per indicator. It
#      does not gate, because a template legitimately has open gaps; its
#      reports ride along in the artifact so a reviewer sees exactly what is
#      still missing before approving publication.
# The deliverables package is emitted as the pipeline artifact and is
# published to S3 only after human approval.
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet --require-hashes -r requirements.lock
  build:
    commands:
      # RESTORE the durable per-KSI metric history BEFORE build/validate/preflight.
      # For Class C/D, FRC-CSX-MOT readiness depends on >= 6/18 months of history
      # that lives ONLY in the evidence bucket (metric-history.json is gitignored,
      # so the CodeConnections full clone does not carry it). Without this restore
      # a legitimate Class C release build sees no history and package-preflight
      # blocks. Skipped harmlessly when EVIDENCE_BUCKET is unset (e.g. the public
      # GitHub Actions run, which never releases Class C).
      # FAIL-CLOSED, mirroring buildspec-collect.yml: a genuine "object does not
      # exist" (no collector has run yet) is allowed and proceeds; ANY other
      # restore error (AccessDenied, KMS, throttling, outage) ABORTS so the build
      # never silently evaluates readiness against absent history and a Class C
      # package can never reach Publish attesting to history it could not read.
      - |
        if [ -n "$EVIDENCE_BUCKET" ]; then
          set -e
          KEY="s3://$EVIDENCE_BUCKET/metrics/metric-history.json"
          if aws s3 cp "$KEY" automation/metrics/metric-history.json 2>/tmp/restore.err; then
            echo "Restored durable metric history for readiness evaluation."
          elif grep -qiE "Not Found|does not exist|NoSuchKey|404" /tmp/restore.err; then
            echo "No prior metric-history.json (confirmed missing); no collector run yet."
          else
            echo "FAIL. Could not restore metric history and the object is not confirmed missing:"
            cat /tmp/restore.err
            echo "Aborting so readiness is not evaluated against absent metric history."
            exit 1
          fi
        else
          echo "EVIDENCE_BUCKET unset; skipping metric-history restore (no Class C release path)."
        fi
      - python sdr.py build
      - git diff --exit-code -- . ':(exclude)*.docx' || { echo "FAIL. Generated outputs differ from committed files. Never edit generated files by hand; edit sdr/records/records-store.json and regenerate."; exit 1; }
      # Validation parity. A DRAFT build runs the gate without the offline test
      # suite (fast feedback; the test suite is exercised in GitHub Actions on
      # every push). A RELEASE build (RELEASE_MODE=true) runs the SAME full gate
      # a local `python sdr.py release` runs: the complete offline test suite AND
      # a double-build reproducibility check, so the AWS release path is not
      # weaker than the GitHub/local release gate.
      - |
        if [ "$RELEASE_MODE" = "true" ]; then
          echo "RELEASE_MODE: running the full validation gate WITH the offline test suite."
          python sdr.py validate
          echo "RELEASE_MODE: running the double-build reproducibility gate."
          python -c "import sdr; import sys; sys.exit(sdr.cmd_reproducibility())"
          echo "RELEASE_MODE: running the audit + security sections of the ONE release gate."
          # Same step list GitHub Actions and `sdr.py release` execute (AUD-F12):
          # oracle, mutation-runner self-test, mutation runner, tree-clean, Bandit.
          pip install --quiet bandit==1.8.6 pip-audit==2.10.1
          python audit/release_gate.py audit security
        else
          python sdr.py validate --no-tests
        fi
      - python automation/sdrscan/sdrscan.py --write-catalog
      - git diff --exit-code -- automation/sdrscan/check-catalog.json || { echo "FAIL. check-catalog.json is out of date with checks.py. Run: python automation/sdrscan/sdrscan.py --write-catalog"; exit 1; }
      - python automation/sdrscan/sdrscan.py --output-formats json,csv,html,txt --only-fails --no-colour --ignore-exit-code-3
      # Submission-readiness preflight. A DRAFT build (the default) reports the
      # readiness blockers so the human approver sees exactly what is unresolved,
      # without failing the build - the public template legitimately has open
      # gaps. A RELEASE build (RELEASE_MODE=true) makes preflight a HARD gate, so
      # a package published as a customer/submission deliverable cannot ship with
      # unresolved readiness blockers.
      - |
        if python sdr.py package-preflight; then
          echo "package-preflight: READY (no submission blockers)."
          if [ "$RELEASE_MODE" = "true" ]; then
            echo "RELEASE_MODE: writing the release attestation (binds the "
            echo "deterministic manifest hash to this exact git commit/tree)."
            python validation/scripts/build_release_attestation.py
          fi
        else
          echo "package-preflight: NOT READY - blockers above."
          if [ "$RELEASE_MODE" = "true" ]; then
            echo "FAIL. RELEASE_MODE is set and the package is not submission-ready."
            exit 1
          fi
          echo "DRAFT build: readiness blockers reported, not gated. Set RELEASE_MODE=true to gate."
        fi
  post_build:
    commands:
      - echo "Validation passed. Readiness scan attached. Packaging deliverables."
      # Assemble the customer bundle from EXACTLY what the release manifest
      # fingerprints (the ACTIVE certification class only, plus shared package
      # artifacts, manifest, and attestation). This is active-class-only and
      # manifest-consistent by construction - it does not ship the inactive
      # Class A/C SDRs the repo keeps current for traceability, nor the authoring
      # .docx working files, nor the experimental OSCAL export.
      - python validation/scripts/assemble_release_bundle.py

artifacts:
  base-directory: .
  files:
    # The active-class Certification Package, assembled to match the release
    # manifest exactly. Only this bundle is the customer deliverable; the
    # validation reports ride along (readiness evidence, not fingerprinted).
    - artifacts/release-bundle/**/*
    - validation/reports/**/*
