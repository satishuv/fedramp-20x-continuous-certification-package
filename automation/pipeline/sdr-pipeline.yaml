AWSTemplateFormatVersion: "2010-09-09"
Description: >
  FedRAMP 20x Security Decision Record (SDR) documentation pipeline.
  Source (GitHub via AWS CodeConnections) -> regenerate and validate the SDR
  with CodeBuild -> manual approval -> publish deliverables to a versioned,
  encrypted S3 bucket. Scheduled jobs check the pinned FedRAMP dataset for
  upstream drift daily and run the read-only facts collector.
  Supports FRC-CSX-VVR (persistently verify and validate SDR accuracy),
  SDR-CSX-KMT (historical KSI metrics), and honest human-gated publication.
  Partition-aware (no hardcoded ARN partitions). The GitHub source uses AWS
  CodeConnections, which is not available in AWS GovCloud (US-West); in
  GovCloud, deploy in a Region where the selected CodeConnections source
  provider is supported, or swap the Source stage for a supported provider.

Parameters:
  ConnectionArn:
    Type: String
    Description: >
      ARN of an AWS CodeConnections (CodeStar Connections) connection to the
      git host. Create and authorize it once in the console before deploying.
  FullRepositoryId:
    Type: String
    Description: Repository in owner/name form, for example acme/acme-sdr.
  BranchName:
    Type: String
    Default: main
    Description: Branch that triggers the pipeline.
  NotificationEmail:
    Type: String
    Description: Email address for approval requests and pipeline state changes.
  EnableCollectorSchedule:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Set to true only after reviewing automation/collectors/collect_facts.py
      and granting the collector role in the target account. The collector is
      read-only by construction.

Conditions:
  CollectorOn: !Equals [!Ref EnableCollectorSchedule, "true"]

Resources:

  # Customer-managed KMS key for CodeBuild project encryption (AwsSolutions-CB4)
  # and available for artifact encryption. Key rotation is enabled.
  PipelineKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: SDR pipeline encryption key for CodeBuild projects and artifacts.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  PipelineKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-pipeline"
      TargetKeyId: !Ref PipelineKmsKey

  # Dedicated bucket to receive S3 server access logs (AwsSolutions-S1) for the
  # artifact, deliverables, and evidence buckets. It logs to itself to avoid an
  # infinite logging chain, and blocks all public access.
  LogBucket:
    Type: AWS::S3::Bucket
    # checkov:skip=CKV_AWS_18:This IS the access-log destination bucket; a log
    # bucket cannot log to another log bucket without an infinite chain, so
    # access logging is intentionally not enabled on it (standard exception).
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: >
              This is the access-log destination bucket. Enabling access
              logging on the log bucket itself would create an infinite logging
              chain, so it is intentionally omitted (standard S3 log-bucket
              exception).
    Properties:
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub "${LogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: artifact-access-logs/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DeliverablesBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: deliverables-access-logs/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: evidence-access-logs/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # SSL-only bucket policies (AwsSolutions-S10): deny any request not using TLS.
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DeliverablesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeliverablesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DeliverablesBucket.Arn
              - !Sub "${DeliverablesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # The topic is intentionally NOT encrypted with the AWS-managed aws/sns key:
  # EventBridge and CodePipeline cannot publish through that key's unmodifiable
  # policy, which would silently break approvals and failure notifications. To
  # encrypt it, supply a customer-managed key whose policy grants kms:Decrypt
  # and kms:GenerateDataKey to events.amazonaws.com and
  # codepipeline.amazonaws.com. SSL-in-transit IS enforced below via the topic
  # policy (AwsSolutions-SNS3), which is independent of at-rest encryption.
  NotificationTopic:
    Type: AWS::SNS::Topic
    # checkov:skip=CKV_AWS_26:Intentionally not KMS-encrypted; EventBridge and
    # CodePipeline cannot publish through the aws/sns managed key policy, which
    # would silently break approval and failure notifications. See comment above.
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_26
            comment: >
              The topic is intentionally not encrypted at rest with the
              AWS-managed aws/sns key because EventBridge and CodePipeline
              cannot publish through that key's unmodifiable policy, which would
              silently break approval and failure notifications. SSL-in-transit
              is enforced via the topic policy. To encrypt at rest, supply a
              customer-managed key granting the two services kms:Decrypt and
              kms:GenerateDataKey.

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref NotificationTopic

  CodeBuildRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: >
              Remaining wildcards are least-privilege for the APIs used:
              logs:* is scoped to this stack's /aws/codebuild/* log group path
              (CodeBuild creates a per-build log stream, not knowable at deploy
              time); s3 object actions are scoped to specific bucket ARNs with a
              /* object suffix, which is object-level, not a bucket wildcard.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sdr-codebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub "${ArtifactBucket.Arn}/*"
                  - !Sub "${EvidenceBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !GetAtt EvidenceBucket.Arn
              - Effect: Allow
                Action:
                  # UseConnection is required because the Source stage sets
                  # OutputArtifactFormat: CODEBUILD_CLONE_REF (git full clone).
                  # AWS requires the CodeBuild *service role* (not just the
                  # pipeline role) to hold UseConnection or the initial full
                  # clone build fails. GetConnection/GetConnectionToken alone
                  # are insufficient for the full-clone artifact path.
                  - codeconnections:UseConnection
                  - codeconnections:GetConnectionToken
                  - codeconnections:GetConnection
                  - codestar-connections:UseConnection
                  - codestar-connections:GetConnectionToken
                  - codestar-connections:GetConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref NotificationTopic
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                  - kms:Encrypt
                Resource: !GetAtt PipelineKmsKey.Arn

  CollectorRole:
    Type: AWS::IAM::Role
    Condition: CollectorOn
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: >
              config:DescribeComplianceByConfigRule is a read-only account-wide
              query that does not support resource-level ARNs, so Resource "*"
              is required and is the minimum grant. logs:* is scoped to this
              stack's /aws/codebuild/* log group path; s3:PutObject is scoped to
              the evidence bucket's facts/* prefix.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sdr-collector-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${EvidenceBucket.Arn}/facts/*"
              - Effect: Allow
                # Restore (Get) the prior metric history and persist (Put) the
                # updated one, so SDR-CSX-KMT / FRC-CSX-MOT history accumulates
                # across ephemeral collector runs.
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${EvidenceBucket.Arn}/metrics/*"
              - Effect: Allow
                # Bucket-level ListBucket, scoped to the metrics/ prefix, is
                # required so a first-run restore of a NOT-YET-EXISTENT
                # metric-history.json returns 404 (NoSuchKey) rather than 403.
                # Without s3:ListBucket, S3 returns 403 AccessDenied for a missing
                # object, which the fail-closed restore treats as an abnormal
                # error and aborts the first legitimate collection. The prefix
                # condition keeps this from being a whole-bucket listing grant.
                Action:
                  - s3:ListBucket
                Resource: !GetAtt EvidenceBucket.Arn
                Condition:
                  StringLike:
                    "s3:prefix":
                      - "metrics/*"
                      - "metrics/metric-history.json"
              - Effect: Allow
                # The full canonical read-only collector action set
                # (automation/collectors/collectors.py READ_ONLY_ACTIONS). These
                # are account-wide describe/list/get calls that do not support
                # resource-level ARNs, so Resource "*" is the minimum grant. Kept
                # in sync with the collector by test_collector_iam_matches.py
                # (granted actions must be a superset of what collectors call).
                Action:
                  - accessanalyzer:ListAnalyzers
                  - accessanalyzer:ListFindings
                  - backup:ListBackupPlans
                  - backup:ListProtectedResources
                  - backup:ListRestoreTestingPlans
                  - cloudformation:DescribeStackResourceDrifts
                  - cloudformation:ListStacks
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - codepipeline:GetPipeline
                  - codepipeline:ListPipelines
                  - config:DescribeComplianceByConfigRule
                  - config:DescribeConfigurationRecorderStatus
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConformancePacks
                  - config:GetConformancePackComplianceSummary
                  - config:GetDiscoveredResourceCounts
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTables
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeSecurityGroups
                  - ecr:DescribeRepositories
                  - events:ListRules
                  - guardduty:GetDetector
                  - guardduty:ListDetectors
                  - iam:GetAccountPasswordPolicy
                  - iam:GetAccountSummary
                  - iam:ListAccessKeys
                  - iam:ListRoles
                  - iam:ListUsers
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListCoverage
                  - inspector2:ListFindings
                  - kms:GetKeyRotationStatus
                  - kms:ListKeys
                  - s3:GetBucketEncryption
                  - s3:GetBucketLifecycleConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketVersioning
                  - s3:ListAllMyBuckets
                  - s3control:GetPublicAccessBlock
                  - securityhub:DescribeHub
                  - securityhub:GetFindings
                  - sts:GetCallerIdentity
                  - wafv2:ListResourcesForWebACL
                  - wafv2:ListWebACLs
                Resource: "*"
              - Effect: Allow
                Action:
                  - codeconnections:GetConnectionToken
                  - codeconnections:GetConnection
                  - codestar-connections:GetConnectionToken
                  - codestar-connections:GetConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                  - kms:Encrypt
                Resource: !GetAtt PipelineKmsKey.Arn

  ValidateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-validate"
      Description: Regenerate the SDR, refuse hand-edited outputs, validate with 0 hard failures.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      EncryptionKey: !GetAtt PipelineKmsKey.Arn
      TimeoutInMinutes: 20
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          # This pipeline's next stages are Human Approval -> Publish, so the
          # validate build MUST hard-gate submission readiness: package-preflight
          # blockers fail the build, and a package with known blockers can never
          # reach Publish. (The public GitHub template stays permissive for
          # unfinished authoring; only this publication path sets RELEASE_MODE.)
          - Name: RELEASE_MODE
            Type: PLAINTEXT
            Value: "true"
          # Name of the evidence bucket holding the durable per-KSI metric
          # history (metrics/metric-history.json). The release build restores it
          # before package-preflight so Class C/D FRC-CSX-MOT readiness is
          # evaluated against real accumulated history, not an empty tree.
          - Name: EVIDENCE_BUCKET
            Type: PLAINTEXT
            Value: !Ref EvidenceBucket
      Source:
        Type: CODEPIPELINE
        BuildSpec: automation/pipeline/buildspec-validate.yml

  DriftCheckProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-drift-check"
      Description: Daily hash-compare of the pinned FedRAMP dataset and schemas against upstream.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      EncryptionKey: !GetAtt PipelineKmsKey.Arn
      TimeoutInMinutes: 10
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: SNS_TOPIC_ARN
            Value: !Ref NotificationTopic
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${FullRepositoryId}.git"
        BuildSpec: automation/pipeline/buildspec-drift-check.yml
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref ConnectionArn

  CollectorProject:
    Type: AWS::CodeBuild::Project
    Condition: CollectorOn
    Properties:
      Name: !Sub "${AWS::StackName}-collector"
      Description: Read-only facts collector; writes timestamped facts to the evidence bucket.
      ServiceRole: !GetAtt CollectorRole.Arn
      EncryptionKey: !GetAtt PipelineKmsKey.Arn
      TimeoutInMinutes: 15
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: EVIDENCE_BUCKET
            Value: !Ref EvidenceBucket
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${FullRepositoryId}.git"
        BuildSpec: automation/pipeline/buildspec-collect.yml
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref ConnectionArn

  PipelineRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: >
              s3 object actions are scoped to the specific artifact and
              deliverables bucket ARNs with a /* object suffix (object-level,
              not a bucket wildcard); all other actions target explicit
              resource ARNs. This is least-privilege for a pipeline role.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sdr-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub "${ArtifactBucket.Arn}/*"
                  - !Sub "${DeliverablesBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !GetAtt DeliverablesBucket.Arn
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt ValidateProject.Arn
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref NotificationTopic

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
                # Full clone so the validate stage can run the
                # regenerate-then-git-diff gate; the zip format carries no
                # git metadata.
                OutputArtifactFormat: CODEBUILD_CLONE_REF
              OutputArtifacts:
                - Name: SourceOutput
        - Name: ValidateAndPackage
          Actions:
            - Name: RegenerateValidatePackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ValidateProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: Deliverables
        - Name: HumanApproval
          Actions:
            - Name: ApprovePublication
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                NotificationArn: !Ref NotificationTopic
                CustomData: >
                  Review the validation report in the build logs before
                  approving. Approval publishes the SDR deliverables package.
        - Name: Publish
          Actions:
            - Name: PublishDeliverables
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                BucketName: !Ref DeliverablesBucket
                Extract: "true"
              InputArtifacts:
                - Name: Deliverables

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sdr-scheduled-builds
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource:
                  - !GetAtt DriftCheckProject.Arn
                  - !If [CollectorOn, !GetAtt CollectorProject.Arn, !Ref "AWS::NoValue"]

  DailyDriftCheck:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily upstream drift check of the pinned FedRAMP sources.
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: drift-check
          Arn: !GetAtt DriftCheckProject.Arn
          RoleArn: !GetAtt EventsRole.Arn

  DailyCollector:
    Type: AWS::Events::Rule
    Condition: CollectorOn
    Properties:
      Description: Daily read-only facts collection for KSI metrics.
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: collector
          Arn: !GetAtt CollectorProject.Arn
          RoleArn: !GetAtt EventsRole.Arn

  PipelineStateNotification:
    Type: AWS::Events::Rule
    Properties:
      Description: Email on pipeline failures and manual approval needed.
      EventPattern:
        source: ["aws.codepipeline"]
        detail-type: ["CodePipeline Pipeline Execution State Change"]
        detail:
          pipeline: [!Ref Pipeline]
          state: ["FAILED", "SUCCEEDED"]
      State: ENABLED
      Targets:
        - Id: sns
          Arn: !Ref NotificationTopic

  # AUD-F32: the daily collector and drift check are CodeBuild projects started
  # directly by the schedule rules above, so a failed collection never produces
  # a CodePipeline state change and the rule above never fires for it. Without
  # this rule the collector can fail for weeks (expired role, denied API,
  # wrong region) while the FRC-CSX-MOT history silently stops accumulating.
  ScheduledBuildFailureNotification:
    Type: AWS::Events::Rule
    Properties:
      Description: Email when the daily collector or drift check build fails.
      EventPattern:
        source: ["aws.codebuild"]
        detail-type: ["CodeBuild Build State Change"]
        detail:
          build-status: ["FAILED", "FAULT", "TIMED_OUT", "STOPPED"]
          project-name:
            - !Ref DriftCheckProject
            - !If [CollectorOn, !Ref CollectorProject, !Ref "AWS::NoValue"]
      State: ENABLED
      Targets:
        - Id: sns
          Arn: !Ref NotificationTopic

  NotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref NotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "sns:Publish"
            Resource: !Ref NotificationTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NotificationTopic
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NotificationTopic

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  DeliverablesBucketName:
    Description: Versioned, encrypted bucket holding published SDR packages.
    Value: !Ref DeliverablesBucket
  EvidenceBucketName:
    Description: Bucket receiving timestamped collector facts under facts/.
    Value: !Ref EvidenceBucket
